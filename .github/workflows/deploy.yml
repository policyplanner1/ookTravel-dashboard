name: Deploy OokTravel

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "SSH_USER=ooktravel" >> $GITHUB_ENV
            echo "REMOTE_PATH=/home/ooktravel/backend" >> $GITHUB_ENV
            echo "PM2_NAME=ooktravel-backend" >> $GITHUB_ENV
          else
            echo "SSH_USER=devooktravel" >> $GITHUB_ENV
            echo "REMOTE_PATH=/home/devooktravel/backend" >> $GITHUB_ENV
            echo "PM2_NAME=ooktravel-dev-backend" >> $GITHUB_ENV
          fi

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: ./
          remote_path: ${{ env.REMOTE_PATH }}
          remote_host: 103.241.146.229
          remote_user: ${{ env.SSH_USER }}
          remote_key: ${{ github.ref_name == 'main' && secrets.SSH_PRIVATE_KEY_PROD || secrets.SSH_PRIVATE_KEY_DEV }}
          exclude: "node_modules/ .git/ .github/ .env"

      - name: Install deps and restart via PM2
        uses: appleboy/ssh-action@v1
        with:
          host: 103.241.146.229
          username: ${{ env.SSH_USER }}
          key: ${{ github.ref_name == 'main' && secrets.SSH_PRIVATE_KEY_PROD || secrets.SSH_PRIVATE_KEY_DEV }}
          script: |
            cd ${{ env.REMOTE_PATH }}
            npm ci --omit=dev
            sudo /usr/local/lib/node_modules/pm2/bin/pm2 restart ${{ env.PM2_NAME }}
